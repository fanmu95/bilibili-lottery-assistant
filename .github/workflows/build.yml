# ============================================================
# 自动构建：push/tag 后自动
#   ① Windows exe（PyInstaller 打包，上传 Artifact；打 tag 自动发 Release）
#   ② Docker 镜像（linux/amd64 + linux/arm64 双架构，推送 ghcr.io）
# 触发：push main / 打 v* tag / 手动 workflow_dispatch
# ============================================================
name: Build exe & Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # 上传 Release 资产
  packages: write        # 推送 ghcr.io 容器镜像

jobs:
  # ---------- ① Windows exe ----------
  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    env:
      # Windows runner 偶发 schannel 证书校验失败（SEC_E_UNTRUSTED_ROOT），
      # 跳过 SSL 校验保证 checkout 稳定（GitHub Actions 官方 runner 环境）
      GIT_SSL_NO_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端 dist
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: 安装后端依赖 + PyInstaller
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: 打包 exe（onedir windowed）
        run: |
          python -m PyInstaller --noconfirm --onedir --name "抽奖助手" --windowed `
            --workpath build_win --distpath dist_win `
            --add-data "frontend/dist;dist" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import multipart `
            --collect-all app `
            backend/run.py

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path "dist_win/抽奖助手/*" -DestinationPath "lottery-assistant-win64.zip" -Force

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: lottery-assistant-win64.zip
          retention-days: 14

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lottery-assistant-win64.zip
          generate_release_notes: true

  # ---------- ② Docker 镜像（amd64 + arm64） ----------
  docker:
    name: Docker (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU（交叉架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
